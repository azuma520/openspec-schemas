name: superpowers-bridge
version: 2
description: >
  Spec-driven workflow integrated with Superpowers skills.
  Requirements: Superpowers plugin installed, providing skills:
  brainstorming, using-git-worktrees,
  subagent-driven-development, finishing-a-development-branch.
  Requires a subagent-capable platform (Claude Code, Codex, etc.) —
  this schema does not support runtimes without subagent support,
  because the alternative executor (executing-plans) dispatches no
  independent reviewer, losing the review rigor Superpowers brings.
  If your platform lacks subagent support, use spec-driven instead.
  Each artifact / apply step verifies its required skills before
  invoking and surfaces a clear error if any are missing.
  brainstorm → proposal → specs → tasks → plan → verify → retrospective.
  design is required (reorganizes raw brainstorm output into structured
  Context / Goals / Decisions / Risks / Migration; referenced by tasks
  and plan for implementation guidance).
  Apply phase uses git worktrees + subagent-driven-development
  (structural code-review dispatch; TDD applicability is declared
  per task in tasks.md, and tasks annotated applicable record
  RED/GREEN evidence there — verify's deterministic checks read
  the presence and structure of that evidence before archive,
  instruction-mediated rather than a mechanically enforced,
  non-bypassable gate).

artifacts:
  - id: brainstorm
    generates: brainstorm.md
    description: Collaborative design exploration using Superpowers brainstorming
    template: brainstorm.md
    instruction: |
      PRECHECK — required skill availability:
      Before invoking, confirm `superpowers:brainstorming` appears in
      your available skills list. If missing, STOP and inform the user
      that the Superpowers plugin must be installed (or that they can
      explicitly opt to write brainstorm.md manually using the template
      below). Do NOT silently fall back.

      Use the Skill tool to invoke **superpowers:brainstorming**.

      IMPORTANT output redirection:
      - Do NOT write to `docs/superpowers/specs/`. Instead, write the
        brainstorming output directly to this change's `brainstorm.md`.
      - brainstorm.md is a RAW CAPTURE — write the brainstorming
        skill's full output as-is, without forcing any template
        structure. The skill's natural output is typically a decision
        log (background → decision chain Q1-Qn → design trade-offs),
        but the format varies by conversation. Preserve the skill's
        natural organization.
      - Do NOT pre-fill design.md during this step. design.md is a
        separate artifact that reorganizes brainstorm.md content into
        structured sections (Context, Goals, Decisions, Risks,
        Migration). That transformation happens in the design step.

      The brainstorming skill will:
      1. Explore project context
      2. Ask clarifying questions (one at a time)
      3. Propose 2-3 approaches with trade-offs
      4. Present design sections for approval
      5. Output the validated design
    requires: []

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document based on the brainstorming output.

      Read brainstorm.md for the validated design. Extract:
      - **Why**: The motivation (from brainstorming discussion)
      - **What Changes**: Specific changes agreed upon
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Check `openspec/specs/` for existing spec names.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      Since brainstorming already explored the problem space,
      this should be a concise extraction, not a new exploration.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Each capability listed here will need a spec file.

      Keep it concise (1-2 pages). Focus on the "why" not the "how".
    requires:
      - brainstorm

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document explaining HOW to implement the change.

      Read brainstorm.md as input. brainstorm.md is a raw capture of
      the brainstorming skill's output (typically a decision log with
      Q1-Qn decisions, trade-offs, and context). Your job is to
      REORGANIZE that content into the structured sections below.

      This is a transformation, not a copy. Extract and restructure:
      - Decisions (Q1-Qn from brainstorm) → design.md §Decisions
      - Background/context → design.md §Context
      - Trade-offs → design.md §Risks / Trade-offs
      - Add Goals/Non-Goals and Migration Plan (may require
        inference from brainstorm.md content)

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered per decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation.
      Good design docs explain the "why" behind technical decisions.
    requires:
      - brainstorm

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)

      Reference specs for what needs to be built and design.md for
      how to build it (architecture decisions, trade-offs, migration).

      TDD APPLICABILITY — tasks.md is the single source of truth.
      Every task MUST carry a TDD applicability annotation. It is a
      markdown list item nested under the task's own checkbox line —
      indented two spaces from the `- [ ]` marker, so its own `- `
      begins at column 3 — and it is written in exactly one of these
      two forms (the leading `- ` IS part of the required form):

        - TDD: applicable
        - TDD: n/a — <reason>

      SEPARATOR: between `n/a` and the reason, any one of `—` (em dash,
      canonical — write this one where you can), `–` (en dash), `-`
      (hyphen), or `--`. All four are accepted; nothing else is. What
      the form requires is a non-empty reason, not a particular
      character — an `n/a` with no reason after the separator is
      non-conforming whichever separator was typed.

      Seed vocabulary for `<reason>`: throwaway prototype, generated
      code, configuration, prose/doc-only. That is a seed, not a closed
      set — write the reason that is actually true for the task. The
      annotation is a semantic assertion: whether an `n/a` reason holds
      is a REVIEW judgement, not a machine judgement. Of the annotation,
      the deterministic verify checks read presence and format only.

      plan.md entries MAY echo a task's applicability but MUST NOT
      redefine it, and plan.md MUST NOT hold a second copy of the
      evidence.

      EVIDENCE FOR APPLICABLE TASKS — a RED record and a GREEN record,
      written in tasks.md, nested under the same task checkbox beside
      its `TDD:` annotation (same two-space indent), as part of that
      task's completion claim (written when the task completes, not
      when the list is drafted). Each record is a `- RED:` / `- GREEN:`
      list item whose fields are nested one level further, indented four
      spaces from the `- [ ]` marker, each written as a `- <key>: <value>`
      list item using these literal keys:

      - `- RED:` requires `subject:` (the test's identifier; the format
        this schema requires is `test-file::test-name` — its first
        convention for this, not an architecture invariant), `outcome:`,
        and `failure:` —
        a failure output excerpt sufficient to show the target behaviour
        was not yet satisfied.
      - `- GREEN:` requires `subject:` and `outcome:`. Its `subject:`
        value MUST be identical to RED's, character for character.

      OUTCOME MARKERS: `outcome:` takes a single uppercase token.
      GREEN's MUST be the literal `PASS`. RED's MUST be any token other
      than `PASS`; write `FAIL` unless your runner's own word is more
      accurate (`ERROR`, `FAILED`).

      The invocation (the command that was run) is supporting evidence:
      recommended for reproducibility, NOT required. If you record it,
      add it as a further `- invocation: <command>` field. A SyntaxError,
      import error, missing dependency or test-harness error is not a
      valid RED outcome — but that, like the `n/a` reason, is a REVIEW
      judgement; the deterministic checks see only a non-`PASS` marker.

      SHAPE — this block is normative, not illustrative. Reproduce its
      keys, nesting and indentation exactly; only the values change.

        - [ ] 2.1 Login error handling
          - TDD: applicable
          - RED:
            - subject: test/auth.test.js::rejects empty email
            - outcome: FAIL
            - failure: expected 'Email required', got undefined
          - GREEN:
            - subject: test/auth.test.js::rejects empty email
            - outcome: PASS

      tasks.md is the FIRST STORAGE LOCATION for this evidence, not an
      architecture invariant — a later Result/Evidence store may replace
      it without changing the evidence semantics above. (That is a
      separate question from the `subject:` format above, which names a
      test rather than a place.)

      SELF-REVIEW before you finish — this is earlier feedback, not the
      required control. The required control is the verify artifact,
      whose deterministic checks run before archive and block on
      failure; that enforcement is instruction-mediated (an agent
      following the verify instruction), not a mechanically enforced,
      non-bypassable gate, so passing this check is not a guarantee.
      Check both conditions and fix what you find: is any task missing
      its TDD annotation, and does any `TDD: n/a` lack a reason after
      the separator?
    requires:
      - specs
      - design

  - id: plan
    generates: plan.md
    description: Per-task execution contract — what "done" means for each task, not how to get there
    template: plan.md
    instruction: |
      Write plan.md yourself, directly from this change's tasks.md,
      design.md and specs/. No skill invocation is required to produce
      it. You MAY use a decomposition aid such as
      `superpowers:writing-plans` privately, but its micro-step output
      does not define this artifact's format — what you write must
      conform to the Plan Contract below.

      plan.md is a per-task execution contract: each entry states what
      "done" means for one task, not how to get there. Two executors may
      satisfy the same entry by different paths and both conform.

      STRUCTURE — a header, then exactly one entry per tasks.md task.

      1. Header
         - Goal: what this change delivers, in one or two sentences.
         - Pointers: this change's specs/ files and design.md. Reference
           architecture and tech-stack decisions there; do not repeat
           them here.
         - Global constraints: copied verbatim from the specs, stated
           once, binding on every entry below.

      2. One contract entry per task in tasks.md, keyed by the tasks.md
         task number (1:1 — the set of entry keys and the set of task
         numbers must be identical in both directions; a task with no
         entry and an entry keyed to no task are both defects). Write
         each entry as a `##` heading whose text BEGINS with that task
         number, e.g. `## 1.1 — Login error handling`; the title after
         the number is free. The key must LEAD so the entry-key set is
         readable without interpretation — verify's deterministic
         key-set check reads exactly this form. A `##` heading that
         does not begin with a number is not an entry (this plan's own
         header, a self-review section). Each entry states:

         - Delivers — the end-to-end behaviour this task produces, not a
           layer-by-layer implementation list.
         - Acceptance criteria — concrete and verifiable. Vague language
           such as "works correctly" or "handles errors appropriately"
           is non-conforming: someone who did not write the entry must
           be able to check the criterion and reach the same answer.
         - Blocked by — the tasks that must land first, or an explicit
           "none".
         - Interfaces — CONDITIONAL. Required only where the task
           couples with another task: the names and shapes it consumes
           or produces, and which task sits on the other end. Omit it
           for a task with no cross-task coupling; do not invent one to
           fill the field.

      RIGHT-SIZING: one entry per task, and a task is the smallest unit
      that carries its own verification cycle and is worth a fresh
      reviewer's gate — sized to fit a single fresh context window.

      WHAT NOT TO WRITE: do not decompose entries into micro-steps and
      do not prescribe an execution sequence. Exact file paths, code
      snippets, test commands and commit points are NOT required —
      implementation detail goes stale fastest, and prescribing it takes
      ownership of the path away from the executor. A decision-rich
      snippet (state machine, schema, type shape) MAY be included where
      it encodes a decision more precisely than prose can.

      TDD stays in tasks.md: the applicability annotation and the
      RED/GREEN evidence live under the task checkboxes there. An entry
      MAY echo a task's applicability but MUST NOT redefine it, and
      plan.md MUST NOT hold a second copy of the evidence.

      SELF-REVIEW before you finish. This is generation-time feedback,
      not the required control: the required control is the verify
      artifact, whose deterministic checks are run before archive and
      block on failure. That enforcement is instruction-mediated — an
      agent following the verify instruction — not a mechanically
      enforced gate, so passing this list is not a guarantee.
      1. Entry keys — does the set of entry keys equal the set of
         tasks.md task numbers exactly, in both directions?
      2. Acceptance criteria — is every one of them checkable by someone
         who did not write it? Rewrite any that are not.
      3. Interfaces — does every task that couples with another task
         state its interfaces, and does each side name the other?
    requires:
      - tasks

  - id: verify
    generates: verify.md
    description: Post-implementation verification against specs, design, and tasks
    template: verify.md
    instruction: |
      PRECHECK — implementation evidence:
      Before producing verify.md, run BOTH commands. If either
      returns 0, STOP and tell the user that apply phase has not
      yet produced reviewable changes.

      1. Commit evidence (must return > 0):
         git log --oneline $(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD origin/master 2>/dev/null)..HEAD | wc -l

      2. Task progress (must return > 0):
         grep -c '^- \[x\]' openspec/changes/<change-name>/tasks.md

      Only after BOTH return positive numbers, proceed to invoke
      the verification skill below.

      Use the Skill tool to invoke **openspec-verify-change** (the
      `/opsx:verify` slash command is its user-facing equivalent).

      IMPORTANT timing note:
      - Unlike other artifacts, verify.md is produced AFTER the apply
        phase completes, NOT during planning. The `requires: [plan]`
        edge exists only for schema graph purposes — the actual
        verification step MUST run on a completed implementation.

      The verify step MUST perform the following checks and record
      results in verify.md using the template:

      1. **Structural validation**: Run `openspec validate --all --json`
         in the repository root and confirm every item returns
         `"valid": true`. If any item fails, record the issues and
         return to fix the underlying artifact before proceeding.

      2. **Task completion**: Confirm every checkbox in tasks.md is
         `- [x]`. For any `- [ ]` remaining, document the reason
         (e.g. manual / out-of-scope / blocked) and whether it blocks
         archive.

      3. **Delta spec sync state**: For each directory under
         `openspec/changes/<name>/specs/`, compare against the
         corresponding `openspec/specs/<capability>/spec.md` and
         record one of:
         - ✓ Already synced
         - ✗ Needs sync (list the capabilities)
         - N/A (no delta specs produced)

      4. **Design/specs coherence**: Spot-check that design.md
         decisions reference or align with the requirements listed
         in specs/. Record any drift as a warning (non-blocking).

      5. **Implementation signal**: Confirm all code changes are
         committed (no unstaged files in the worktree). Cite the
         commit range if known.

      6. **Front-door routing leak detector** (warning, non-blocking):

         For projects using superpowers-bridge, design output
         should never land in `docs/superpowers/specs/` — the
         brainstorm artifact's output redirection (see this
         schema's brainstorm.instruction) routes it to
         `openspec/changes/<name>/brainstorm.md`. Run:

           ls docs/superpowers/specs/*.md 2>/dev/null

         If any files exist, record a WARNING: "Front-door routing
         leak — design output found at docs/superpowers/specs/...;
         these belong in openspec/changes/<name>/brainstorm.md or
         design.md. Move/delete after confirming content is captured
         in the change directory."

         Non-blocking — adopters may have legitimate non-schema use
         of that directory predating schema install. Surfaces the
         leak so the user can decide whether to clean up.

      7. **Deferred dogfood vs automated-test equivalence**:

         If plan.md has any tasks marked `[~]` deferred (manual smoke /
         dogfood / live-environment checks that weren't run in this
         cycle), enumerate each in verify.md §7 and identify the
         equivalent automated test that covers the same assertions.

         If no equivalent automated test exists for a deferred manual
         check, that row is a real coverage gap — record in
         retrospective Misses with a follow-up plan, not silently
         deferred.

         The decision table makes "deferred-but-covered" vs "deferred-
         and-gapped" visible at archive time, so reviewers can audit
         completeness without re-deriving the rationale from plan +
         test files.

         Non-blocking on its own — Overall Decision remains PASS even
         with identified gaps, provided they're recorded as follow-up.
         Blocks only if §7 is empty AND plan.md has `[~]` rows (means
         the gap analysis was skipped, not that gaps don't exist).

      CHECKS 8-12 — TDD EVIDENCE CONTRACT AND PLAN/TASK KEY SET.
      These five are DETERMINISTIC: each decides its verdict by
      reading text against a fixed rule, with no judgement call. The
      `tasks` artifact's instruction is the definition of the
      annotation grammar and the record shape; these checks read
      exactly that grammar and add nothing to it.

      Shared definitions, used by checks 8-11:

      - A TASK LINE in tasks.md is any line whose first non-space
        characters are `- [`, one character, `]` — `- [ ]`, `- [x]`
        and `- [~]` alike. Let N be that line's indent (its number of
        leading spaces).
      - A line BELONGS TO that task when it comes after the task line,
        before the next task line or `#` heading whose indent is <= N,
        and its own indent is STRICTLY GREATER than N.
      - BLANK LINES ARE TRANSPARENT. A blank line belongs to nothing
        and ends nothing: skip it and keep reading. A task's range
        ends at the next NON-BLANK task line or `#` heading whose
        indent is <= N, or at the end of the file.
      - INDENT RULE — any indent strictly greater than N is accepted.
        The `tasks` instruction tells authors to write two spaces, and
        the templates show two; this check does NOT require that
        depth. The contract's obligation is nesting, not a column
        count, so a conforming tasks.md that a formatter re-indented
        must not be blocked for the width of its indent.

       8. **TDD annotation present and well-formed** (deterministic):

          For EVERY task line in tasks.md, exactly one line belonging
          to it must match, after its indent is trimmed, one of these
          two forms — the leading `- ` IS part of the required form:

            - TDD: applicable
            - TDD: n/a <SEP> <reason>

          <SEP> is one of `—` (em dash, canonical), `–` (en dash), `-`
          (hyphen), or `--`, and nothing else; the obligation is a
          non-empty <reason>, not a particular character. Zero
          matching lines, more than one, any other form, or an `n/a`
          whose reason is empty after trimming → BLOCK.

       9. **RED and GREEN records present with required fields**
          (deterministic):

          For every task annotated `TDD: applicable`, the lines
          belonging to it must include one `- RED:` line and one
          `- GREEN:` line. Let R be a record line's indent; a FIELD of
          that record is a line written `- <key>: <value>` that comes
          after it with indent strictly greater than R, before the
          next NON-BLANK line whose indent is <= R (the same nesting
          rule, one level deeper — again any greater indent, not a
          fixed width, and again blank lines are transparent: a blank
          line between two fields does NOT end the record. A record
          hand-formatted with spacing is conforming; nothing extra is
          picked up either way, because the field keys are literal).

          `- RED:` requires the fields `subject:`, `outcome:` and
          `failure:`. `- GREEN:` requires `subject:` and `outcome:`.
          `invocation:` is supporting evidence and is never required.
          A task annotated `TDD: n/a` owes no records; if it carries
          them anyway, checks 9-11 do not apply to it. A missing
          record, a missing required field, or a required field whose
          value is empty after trimming → BLOCK.

      10. **Outcome markers** (deterministic): this check reads the
          MARKER ONLY — whether a RED `failure:` excerpt is a
          behavioural failure rather than a harness error is review
          judgement R1 below, never this check. GREEN's `outcome:`
          value must be exactly the token `PASS`. RED's must be a
          single token of uppercase letters A-Z with no whitespace,
          and must not be `PASS` (`FAIL`, `ERROR`, `FAILED` all
          conform). A GREEN outcome other than `PASS`, or a RED
          outcome that is `PASS` or does not match that token form
          → BLOCK.

      11. **RED subject equals GREEN subject** (deterministic): within
          one task, the RED record's `subject:` value and the GREEN
          record's `subject:` value must be identical character for
          character after leading and trailing whitespace is trimmed.
          Any difference → BLOCK.

      12. **tasks.md task-number set equals plan.md entry-key set**
          (deterministic):

          Collect the TASK NUMBER of every task line in tasks.md: the
          token IMMEDIATELY after the `]` of its checkbox and the
          whitespace following it, when that token matches
          `\d+(\.\d+)*` — a task line whose first token there is not a
          number has no task number, and that is itself a defect of
          this check (the plan cannot be keyed 1:1 to it).
          Collect the ENTRY KEY of every plan.md contract entry. The
          `plan` artifact's instruction is what REQUIRES the entry
          form — each entry a `##` heading whose text begins with the
          tasks.md task number, e.g. `## 1.1 — <title>`; this check
          implements that requirement and introduces nothing of its
          own. So: the leading `\d+(\.\d+)*` token of each `##` heading
          in plan.md whose text begins with such a token. Headings
          that do not begin with a number (the plan header, a
          self-review section) are not entries and are not collected.

          If plan.md does not exist at all, this check fails: `plan`
          is a required artifact of this schema, so an absent plan.md
          is not a normal state and must not be read as a vacuous
          pass. Report it as "plan.md absent — no entry keys to
          compare" rather than as a set difference.

          Compare the two sets in BOTH directions and report each
          difference individually: a task number with no entry key,
          and an entry key matching no task number. Equal counts do
          not pass this check — tasks `{1,2,3}` against plan `{1,2,9}`
          fails in both directions. If plan.md exists but no entry key
          can be collected from it, the plan is not keyed 1:1 to the
          tasks and that is itself a failure of this check. Either
          difference non-empty, a task line carrying no task number,
          no collectable entry key, or no plan.md → BLOCK.

      REVIEW JUDGEMENTS — NOT deterministic. Checks 8-12 above cannot
      decide these, and a check reporting no failure says nothing
      about them. Judge each while reading tasks.md, and report a
      violation as a blocking finding of the review, not of a check:

      - R1. Is each RED record's `failure:` excerpt a BEHAVIOURAL
        failure — the target behaviour not yet satisfied — rather than
        a SyntaxError, import error, missing dependency or other
        test-harness error? An error-output RED does not satisfy the
        evidence contract even though check 10 sees a conforming
        non-`PASS` marker.
      - R2. Does the cited `subject:` actually test the behaviour the
        task claims to deliver? Checks 9-11 read the subject as an
        opaque string and compare it to itself.
      - R3. Does each `TDD: n/a` reason hold for that task? Check 8
        reads presence and format only.
      - R4. Does any task annotated `TDD: n/a` nonetheless carry RED
        or GREEN records? Checks 9-11 do not apply to such a task, so
        no check reports it — but at least one of the two is wrong:
        either the applicability call (the task did need TDD) or the
        records (they belong to another task, or nothing ran). Decide
        which, and report it.

      ENFORCEMENT BOUNDARY of checks 8-12 — state it in verify.md as
      written here, and claim no more:

      - The checks are DETERMINISTIC in what they decide, and
        AGENT-EXECUTED (instruction-mediated) in how they run: their
        execution is the verify agent following this instruction.
      - This schema requires them to run before archive and to block on
        failure, but it is NOT a Harness-level, mechanically enforced,
        non-bypassable archive-time gate. If the verify agent does not
        execute one of them, no mechanism in this schema intercepts the
        omission; review of verify.md is the only backstop.
      - They verify the PRESENCE and STRUCTURE of the annotations and
        records. They do not establish that the evidence is authentic
        (the evidence is agent-submitted), do not prove a test-first
        development history, and do not assess semantic quality.

      FRESHNESS of a recorded check result — an execution requirement,
      not a claim about enforcement:

      - A recorded result describes the artifacts AS THEY WERE when the
        check ran. If `tasks.md` or `plan.md` is modified after a check
        result is recorded, that result is STALE: the affected checks
        MUST be re-run and verify.md updated before archive.
      - The affected set is derived from INPUTS, not from which checks
        are newest: check 2 and checks 8-11 read `tasks.md`; check 7
        reads `plan.md`; check 12 reads BOTH. An edit to either file
        staleness-invalidates every result computed from it, so an
        edit to `tasks.md` reaches check 2, 8, 9, 10, 11 and 12, and
        an edit to `plan.md` reaches check 7 and 12.
      - Scope is deliberately those two files. The other checks read
        `specs/`, `design.md`, commit state or `docs/`; staleness for
        those is not addressed here and MUST NOT be claimed to be.
      - This is agent-executed like the checks themselves. Nothing in
        this schema detects a stale result — there is no digest of the
        checked state and no mechanism that compares one. Surfaces
        SHALL NOT describe freshness as mechanically guaranteed.
      - Why this rule exists rather than being left implicit: a check
        that PASSED truthfully does not stop being recorded when its
        inputs change. Reopening a task list after the checks have run
        is ordinary, and without this rule the earlier PASS stays on
        the record describing a state that no longer exists.

      Verify MAY be re-run multiple times as the implementation is
      refined — each run overwrites verify.md with current state.

      If `openspec-verify-change` skill is unavailable, fall back to
      running the numbered checks above manually and recording results
      in verify.md.
    requires:
      - plan

  - id: retrospective
    generates: retrospective.md
    description: Evidence-first retrospective of completed change
    template: retrospective.md
    instruction: |
      PRECHECK — verify completion evidence:
      Before producing retrospective.md, run these commands. If
      any fails, STOP and tell the user verify must pass first.

      1. verify.md exists:
         test -f openspec/changes/<change-name>/verify.md

      2. verify.md records exactly one Overall Decision verdict, and
         it is an acceptable one. The verify.md template has 3
         mutually-exclusive checkboxes in its "Overall Decision"
         section: "✅ PASS", "⚠️ PASS WITH WARNINGS", "❌ FAIL".
         Both commands must succeed:

         a. exactly one of the three boxes is checked:
            test "$(grep -cE '^- \[x\] (✅ PASS|⚠️ PASS WITH WARNINGS|❌ FAIL)' openspec/changes/<change-name>/verify.md)" -eq 1
         b. the checked one is not FAIL:
            ! grep -q '^- \[x\] ❌ FAIL' openspec/changes/<change-name>/verify.md

         Zero checked (no verdict recorded) and more than one checked
         (ambiguous verdict) both STOP, as does FAIL. Check (a) is
         written this way on purpose and must not be "simplified"
         away: (b) alone is fail-open — a verify.md that ticked no
         box at all contains no FAIL line, so the absence of a
         verdict would read as permission to proceed.

      Only after all succeed, proceed.

      Write a retrospective of this change with evidence-first analysis.

      IMPORTANT timing note:
      - retrospective.md is produced AFTER apply phase completes and
        verify.md shows no blocking issues. The `requires: [verify]`
        edge exists only for schema graph purposes; the actual
        retrospective MUST run on a completed, verified implementation.

      Process (follow these 3 steps):

      1. **Gather evidence**
         - Run `git log --oneline <base>..HEAD` in the change worktree
           (or main checkout if the worktree was already merged) to
           get the commit range
         - Read brainstorm.md, plan.md, tasks.md in this change
           directory for plan-vs-actual comparison
         - If verify.md contains failing items, address them BEFORE
           writing the retro

      2. **Write the retrospective sections** — each claim cites
         a commit hash, file path, test name, or measurable fact.

         The retrospective has §0 Evidence (quantitative front-
         matter) plus 6 analysis sections (§1–§6). Downstream
         analysis bullets reference §0 instead of inlining
         `[evidence: commit X]` per line.

         §0) **Evidence** — quantitative front-matter populated
             from `git log <base>..HEAD`, `tasks.md`, and
             verify.md: commit count, diff size (lines/files),
             tasks-done ratio, active hours, subagent dispatch
             count, new external dependencies, post-merge bugs,
             OpenSpec validate state at archive, test coverage
             signal, and a one-line commit chain.

         §1) **Wins** — what worked well, with evidence

         §2) **Misses** — what didn't, marked by severity:
             - 🔴 blocking
             - 🟡 painful
             - 📌 nit

         §3) **Plan deviations** — tasks whose scope changed, and why

         §4) **Skill / workflow compliance** — list each skill in
             this schema's apply phase; mark whether it was
             actually used. For any ✗, fill the
             `### Deliberately Skipped Skills` subsection per the
             rules below.

         §5) **Surprises** — assumptions that turned out wrong

         §6) **Promote candidates → long-term learning** — use
             a `- [ ]` checklist (not a flat table). Each
             candidate:

             - Title with severity emoji (🔴/🟡/📌) + one-
               sentence learning
             - `→ **Promote to** <destination>` (memory /
               CLAUDE.md / schema / skill / one-off)
             - Two body lines aligned with the feedback memory
               schema: `> **Why**: <reason>` and
               `> **How to apply**: <trigger condition>`

             Unchecked `- [ ]` items represent in-flight
             candidates that carry into the next cycle's retro
             for re-evaluation. The checklist + Why/How body
             shape lets candidates transfer mechanically to
             `~/.claude/memory/` without re-writing.

         **Skipped-skill rules for §4**:

         Fill §4 truthfully. The TDD and code-review rows are
         conditional/structural (see the row labels in the
         template): a task annotated `TDD: n/a` in tasks.md is
         not a skip — the annotation is the declaration, and the
         reason it carries is judged by review — and a blank
         subsection records that nothing was deliberately
         skipped, which is not proof of compliance.

         For any skill actually skipped, DO NOT just write a
         one-line reason. Instead, the `### Deliberately Skipped
         Skills` subsection must answer three questions per
         skipped skill:

         - **What was skipped**: the specific skill or sub-step
         - **Why this cycle**: the concrete cycle condition that
           triggered the skip — name the actual trigger (a
           specific commit hash, log line, or observed behavior).
           A short reason like "not needed" must be followed by
           the criterion that made it unnecessary, not left as a
           bare phrase.
         - **How to prevent recurrence**: which of these the
           next cycle in the same situation should rely on
           instead — schema graph fix / skill description
           tightening / CLAUDE.md trigger / scope-judgment
           rule / explicit "one-off — schema boundary case" (the
           last must state why it's a boundary, not just label
           the exception).

         If multiple cycles skip the same skill with similar
         "How to prevent" answers, that pattern is a §6 Promote
         candidate (schema / skill PR motivator). The §4
         subsection is a feedback loop into schema maintenance —
         it should make the next retro's subsection shorter, not
         longer.

      3. **Retrospective skipping policy** (different from §4
         skill skipping — this is whether to write the retro at
         all):

         - Trivial single-commit fixes: OK to skip the
           retrospective entirely. Write a one-liner reason in
           retrospective.md (e.g. "Skipped: single-commit linter
           fix, no insights").
         - Anything else: produce §0 Evidence plus all 6 analysis
           sections (a placeholder "(none observed)" is fine if
           a section truly has nothing).

      4. **Forward-pointer policy (when facts change after writing)**

         Retrospective.md reflects state at write-time. If
         subsequent cycles discover that a claim, evidence, or
         conclusion in this retro was wrong/incomplete:

         - Do NOT rewrite the retrospective (loses audit trail of
           what was known at the time)
         - Add a forward-pointer in the retrospective itself:
           `> **Update YYYY-MM-DD**: section X superseded by
           <link to follow-up retro / commit / issue>`
         - The follow-up artifact carries the corrected analysis

         Why: retrospective is evidence-based — its value is
         capturing what was known and reasoned at a specific point.
         Rewriting it removes that audit trail.

      Write output to retrospective.md using the template structure.
    requires:
      - verify

apply:
  requires: [plan]
  tracks: tasks.md
  instruction: |
    Before implementing, set up an isolated workspace and executor:

    0. **Pre-flight — verify required Superpowers skills**:

       This schema's apply phase requires the following skills.
       Confirm each appears in your available skills list before
       proceeding:

       - superpowers:using-git-worktrees
       - superpowers:subagent-driven-development
         (which dispatches superpowers:requesting-code-review;
          TDD applicability is declared per task in tasks.md, and
          applicable tasks record their evidence there —
          superpowers:test-driven-development is not separately
          invoked by this schema, though an implementer may
          self-trigger it)
       - superpowers:finishing-a-development-branch

       If any required skill is missing, STOP and inform the user —
       do NOT proceed and do NOT silently fall back to manual
       implementation. The user can install the Superpowers plugin,
       or explicitly opt into the manual fallback path described at
       the end of this instruction.

       Additionally, confirm the project's expected CLI tools are
       on PATH. The exact list depends on the project — read
       plan.md and surface any tool mentioned (e.g., `mvn`/`mvnw`,
       `docker`, `python3`, `jq`, `glab`/`gh`, `node`/`npm`). If
       a tool is missing, surface as WARNING (not STOP) — the user
       may have a fallback. Print the missing list once at apply
       start so the user isn't surprised mid-cycle.

    1. **Workspace**: Use the Skill tool to invoke
       **superpowers:using-git-worktrees** to create an isolated
       git worktree for this change.

    2. **Executor — subagent-driven-development**:

       Use the Skill tool to invoke
       **superpowers:subagent-driven-development** to execute
       the plan.md contract entries with fresh subagents per task.

       Tell the executor:
       - Read plan.md in this change directory for the per-task
         execution contract entries (each states what "done" means
         for one task, not how to get there)
       - Update tasks.md checkboxes as coarse tasks complete
       - Work within the created worktree

       IMPORTANT — how TDD and code review actually arrive:

       TDD applicability is annotation-driven from tasks.md: every
       task carries a `- TDD:` list item under its own checkbox
       declaring whether TDD applies to it, and tasks.md is the
       single source of truth for that. A plan.md entry may echo a
       task's applicability but never redefines it.
       Every task annotated `TDD: applicable` owes a RED record and
       a GREEN record under its own checkbox in tasks.md as part of
       that task's completion claim. The `tasks` artifact's
       instruction is the definition of the annotation grammar and
       the record shape — read it there and have the executor do the
       same; do not restate it here or in plan.md.

       What this schema checks, and what it does not: the verify
       artifact requires deterministic (machine-evaluable) checks of
       the PRESENCE and STRUCTURE of those annotations and records
       before archive, and blocks on failure. Those checks are run
       by the verify agent following the verify instruction —
       instruction-mediated, not a Harness-enforced, non-bypassable
       gate. The schema does not judge the semantics or the
       authenticity of the evidence: whether an `n/a` reason holds,
       whether a RED outcome is a behavioural failure rather than a
       harness error, and whether the records reflect what actually
       ran are review judgements, and that assurance degrades with
       the review layer.

       Code review is structural: subagent-driven-development
       dispatches reviewer subagents during execution and a final
       review before apply concludes (it may batch several small
       same-shape tasks into one reviewed diff — not strictly one
       reviewer per task).

       This schema does NOT support `superpowers:executing-plans`
       as a fallback for non-subagent platforms. Per its SKILL.md,
       executing-plans dispatches no independent reviewer — a
       single agent executes the plan and self-checks — and
       upstream itself directs users to subagent-driven-development
       whenever subagents are available. (TDD is not the
       differentiator: applicability and evidence are carried by
       the tasks.md annotations and the evidence contract described
       above, whichever executor runs the tasks.) If your platform
       lacks subagent support, use the built-in `spec-driven`
       schema instead of this one.

    3. **Verification**: When all tasks are done, produce the
       `verify` artifact by invoking **openspec-verify-change**
       to check completeness, correctness, and coherence.
       Re-run verify until all blocking issues are resolved.

    4. **Retrospective (write while context is hot)**:

       Once verify.md shows no blocking issues, produce the
       `retrospective` artifact BEFORE opening any PR. Run the
       retrospective artifact's instruction (which has its own
       PRECHECK confirming verify.md exists and is not FAIL).

       Why now, not after PR: retrospective is part of this cycle's
       deliverables and should land in the same PR. Writing it after
       PR merge produces a separate trailing commit and loses the
       hot context (running tests, fresh fix memory).

    5. **Archive (sync spec delta + move folder)**:

       After retrospective.md is written, run `openspec archive -y`
       (or invoke `/opsx:archive`). This:
       - syncs delta specs from `openspec/changes/<name>/specs/`
         into `openspec/specs/<capability>/spec.md`
       - moves the change folder to
         `openspec/changes/archive/YYYY-MM-DD-<name>/`

       The PR diff after archive contains the COMPLETE cycle state:
       all 8 artifacts done, spec synced into main specs, change
       under archive/.

    6. **Completion (PR is the LAST step)**:

       After retrospective + archive are both done, use the Skill
       tool to invoke **superpowers:finishing-a-development-branch**.

       The branch's PR diff MUST contain the complete archived
       cycle. If it doesn't (e.g., because retrospective or archive
       was skipped), STOP and complete those first.

       This is the canonical opening sequence for the PR — do NOT
       reorder.
